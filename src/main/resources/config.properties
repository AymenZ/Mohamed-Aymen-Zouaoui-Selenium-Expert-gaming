# ===== Configuration generale (modifiable aussi avec -Dcle=valeur) =====
base.url=https://www.expert-gaming.tn

# chrome | firefox | edge
browser=chrome
# true = navigateur sans fenetre
headless=false

timeout.seconds=15
pageload.seconds=60

# Dossier des rapports, captures et traces (relatif a la racine du projet)
reports.dir=reports

# ===== Pages utilisees par les tests =====
# Liste de produits utilisee pour trouver un produit achetable (panier / commande)
products.list.path=/souris-gaming
# Page des promotions
promo.path=/promotions/
# Fragments d'URL qui identifient une fiche produit (separes par des virgules)
product.url.tokens=/produit/,/product/

# ===== Seuils de performance (TC16) =====
perf.lcp.max.ms=2500
perf.load.max.ms=8000

# ===== Securite de la production =====
# false (defaut) : TC08 verifie seulement les champs obligatoires, sans cliquer sur "Commander".
# true : TC08 clique sur "Commander" avec des champs vides (aucune commande ne doit etre creee).
checkout.submitEmpty=false
